name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: jarvis-489914
  SERVICE_NAME: jarvis
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/jarvis-489914/agente-contenido

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push to Artifact Registry
        run: |
          docker build -t $REGISTRY/$SERVICE_NAME:$GITHUB_SHA .
          docker push $REGISTRY/$SERVICE_NAME:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $REGISTRY/$SERVICE_NAME:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --update-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CANVA_CLIENT_ID=CANVA_CLIENT_ID:latest,CANVA_CLIENT_SECRET=CANVA_CLIENT_SECRET:latest,CANVA_REDIRECT_URI=CANVA_REDIRECT_URI:latest" \
            --set-env-vars "STORE_NAME=Mi Tienda,STORE_DESCRIPTION=Tienda online de productos premium"
